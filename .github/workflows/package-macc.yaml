name: Package FlClash with MACC

on:
  workflow_call:
    inputs:
      revision:
        description: App commit validated by the upstream sync workflow
        required: true
        type: string
      upstream_tag:
        required: true
        type: string
      build_version:
        required: true
        type: string
      android_version_code:
        required: true
        type: string
    secrets:
      KEYSTORE:
      SIGNING_PASSWORD:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c
  MACC_ANDROID_CERT_SHA256: e7e71378783e9aaa5e61a0651aeac37cdcb9e139a3ddb56b83671f7733ab66b3

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-latest
          - platform: windows
            arch: amd64
            runner: windows-2022
          - platform: windows
            arch: arm64
            runner: windows-11-arm
            flutter-channel: master
          - platform: android
            arch: arm64
            runner: ubuntu-latest

    steps:
      - name: Enable Git long paths
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          submodules: recursive
          persist-credentials: false

      - name: Apply the upstream build version
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          [[ "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          sed "s/^version: .*/version: $BUILD_VERSION/" pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml

      - name: Set up native Rust on Windows ARM64
        if: matrix.runner == 'windows-11-arm'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://win.rustup.rs/aarch64' -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
          & "$env:RUNNER_TEMP\rustup-init.exe" -y --default-toolchain stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"

      - name: Ensure Inno Setup is available
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path "$inno\ISCC.exe") { exit 0 }
          $installer = "$env:RUNNER_TEMP\innosetup.exe"
          $inno = "$env:RUNNER_TEMP\Inno Setup 6"
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$inno`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path "$inno\ISCC.exe")) {
            throw 'Inno Setup installation failed.'
          }
          Add-Content $env:GITHUB_ENV "INNO_SETUP_PATH=$inno"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Select Xcode
        if: matrix.platform == 'macos'
        run: |
          for version in 26.3 26.2; do
            xcode="/Applications/Xcode_${version}.app"
            if [[ -d "$xcode" ]]; then
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcodebuild -version

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        if: matrix.platform == 'android'

      - uses: nttld/setup-ndk@v1
        if: matrix.platform == 'android'
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Configure Android signing
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$SIGNING_PASSWORD" ]]; then
            echo '::error::Set MACC_ANDROID_KEYSTORE and MACC_ANDROID_KEYSTORE_PASSWORD.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          printf '\nkeyAlias=flclash-macc\nstorePassword=%s\nkeyPassword=%s\n' \
            "$SIGNING_PASSWORD" "$SIGNING_PASSWORD" >> android/local.properties
          echo 'FLCLASH_MACC_ANDROID_RELEASE=true' >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Fetch the pinned CA bundle
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -

      - name: Build package
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          FLUTTER_MACOS_ARM64_ONLY: ${{ matrix.platform == 'macos' && matrix.arch == 'arm64' }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: dart tool/package.dart ${{ matrix.platform }} --arch ${{ matrix.arch }} --env stable --tag "$UPSTREAM_TAG" -v

      - name: Verify the Android certificate, application ID and version
        if: matrix.platform == 'android'
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          UPSTREAM_ANDROID_CODE: ${{ inputs.android_version_code }}
        run: |
          sdk_tools=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          apks=(dist/*.apk)
          test "${#apks[@]}" = 1
          signature=$("$sdk_tools" verify --print-certs "${apks[0]}")
          certificate=$(sed -n 's/^.*certificate SHA-256 digest: //p' <<< "$signature" | sort -u)
          if [[ "$certificate" != "$MACC_ANDROID_CERT_SHA256" ]]; then
            echo '::error::The APK signer does not match the pinned MACC release certificate.'
            exit 1
          fi
          metadata=$("${sdk_tools%/*}/aapt2" dump badging "${apks[0]}")
          echo "MACC Android signing certificate: $certificate"
          package=$(sed -n '/^package: /p' <<< "$metadata")
          echo "$package"
          if [[ "$package" != "package: name='com.follow.clash.macc' versionCode='$UPSTREAM_ANDROID_CODE'"* ||
                "$package" != *" versionName='${UPSTREAM_TAG#v}'"* ]]; then
            echo '::error::The APK has an unexpected application ID or version code.'
            exit 1
          fi

      - name: Verify the macOS app version fields
        if: matrix.platform == 'macos'
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          plist=build/macos/Build/Products/Release/FlClash.app/Contents/Info.plist
          name=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")
          code=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")
          echo "macOS version: $name+$code"
          test "$name+$code" = "$BUILD_VERSION"

      - name: Verify the Windows executable version string
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          $portable = Get-ChildItem dist/*portable.zip
          Expand-Archive -LiteralPath $portable.FullName -DestinationPath "$env:RUNNER_TEMP/version-check"
          $app = Get-ChildItem "$env:RUNNER_TEMP/version-check" -Recurse -Filter FlClash.exe
          $version = $app.VersionInfo.ProductVersion
          Write-Output "$($app.Name) ProductVersion=$version"
          if ($version -ne $env:BUILD_VERSION) { throw "Unexpected ProductVersion: $version" }

      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-MACC-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
