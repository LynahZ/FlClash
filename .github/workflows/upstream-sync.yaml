name: Sync upstream stable release

on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-macc.yaml'
      - '.github/scripts/publish-macc-release.sh'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the merge without publishing
        type: boolean
        default: false
      package_current:
        description: Package the fork even when the latest release is already synced
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-stable-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'LynahZ/FlClash' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      candidate: ${{ steps.merge.outputs.candidate }}
      revision: ${{ steps.merge.outputs.revision }}
      upstream_tag: ${{ steps.merge.outputs.tag }}
      needs_release: ${{ steps.merge.outputs.needs_release }}
      previous_run: ${{ steps.reuse.outputs.run }}
      previous_revision: ${{ steps.reuse.outputs.revision }}
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream release and its pinned core
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/chen08209/FlClash/releases/latest \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The latest upstream release has an unexpected tag."
            exit 1
          fi
          git fetch --no-tags https://github.com/chen08209/FlClash.git "refs/tags/$tag"
          release=$(git rev-parse 'FETCH_HEAD^{commit}')
          bash .github/scripts/prepare-upstream-sync.sh "$release" "$tag" \
            https://github.com/chen08209/Clash.Meta.git "$RUNNER_TEMP/upstream-sync"
          if [[ -f "$RUNNER_TEMP/upstream-sync/application.bundle" ]]; then
            echo 'candidate=true' >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream_revision=$release" >> "$GITHUB_OUTPUT"
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag-macc\" and .draft == false) | .id")
          if [[ -z "$published" ]]; then
            echo 'needs_release=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Find a completed build for the same upstream release
        id: reuse
        if: >-
          github.event_name == 'push' && steps.merge.outputs.needs_release == 'true' &&
          steps.merge.outputs.candidate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.merge.outputs.tag }}
          UPSTREAM_REVISION: ${{ steps.merge.outputs.upstream_revision }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/upstream-sync.yaml/runs?branch=$GITHUB_REF_NAME&status=success&per_page=30" \
            --jq '.workflow_runs[] | [.id, .head_sha] | @tsv')
          while IFS=$'\t' read -r run revision; do
            [[ -n "$run" ]] || continue
            git merge-base --is-ancestor "$revision" HEAD || continue
            git merge-base --is-ancestor "$UPSTREAM_REVISION" "$revision" || continue
            version=$(git show "$revision:pubspec.yaml" | sed -n 's/^version: \([^+]*\).*/\1/p')
            [[ "$version" == "${UPSTREAM_TAG#v}" ]] || continue
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.expired == false and (.name | startswith("FlClash-MACC-")))] | length')
            if [[ "$artifacts" == 5 ]]; then
              echo "run=$run" >> "$GITHUB_OUTPUT"
              echo "revision=$revision" >> "$GITHUB_OUTPUT"
              break
            fi
          done <<< "$runs"

      - uses: actions/setup-go@v5
        if: steps.merge.outputs.candidate == 'true' || steps.merge.outputs.needs_release == 'true' || github.event_name != 'schedule'
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Verify MACC and run core tests
        if: steps.merge.outputs.candidate == 'true' || steps.merge.outputs.needs_release == 'true' || github.event_name != 'schedule'
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: |
          git submodule update --init -- Clash.Meta
          go test -json . > "$RUNNER_TEMP/core-test.json" || {
            cat "$RUNNER_TEMP/core-test.json"
            exit 1
          }
          jq -e -s '([.[] | select(.Action == "pass") | .Test]) as $passed
            | ["TestLoadMaccProfile", "TestMaccSaltAndMalformedAddress", "TestMaccUDPRoundTrip"]
            | all(. as $test | $passed | index($test) != null)' "$RUNNER_TEMP/core-test.json"

      - uses: actions/upload-artifact@v4
        if: steps.merge.outputs.candidate == 'true' && !inputs.dry_run
        with:
          name: upstream-sync-bundles
          path: ${{ runner.temp }}/upstream-sync/*.bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    if: needs.prepare.outputs.candidate == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: upstream-sync-bundles
          path: ${{ runner.temp }}/upstream-sync

      - name: Publish the validated app and core commits atomically
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HAS_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: |
          bundles="$RUNNER_TEMP/upstream-sync"
          git fetch --no-tags "$bundles/application.bundle" HEAD:refs/sync/application
          if [[ "$HAS_SYNC_TOKEN" != true ]] &&
            ! git diff --quiet HEAD refs/sync/application -- .github/workflows; then
            echo "::error::The release changes workflows. Set UPSTREAM_SYNC_TOKEN with Contents and Workflows write access to this fork."
            exit 1
          fi
          refs=("refs/sync/application:refs/heads/$DEFAULT_BRANCH")
          if [[ -f "$bundles/core.bundle" ]]; then
            git fetch --no-tags "$bundles/core.bundle" HEAD:refs/sync/core
            refs+=(refs/sync/core:refs/heads/macc-core)
          fi
          git push --atomic origin "${refs[@]}"

  package:
    needs: [prepare, publish]
    if: >-
      !cancelled() && !inputs.dry_run && needs.prepare.result == 'success' &&
      needs.prepare.outputs.previous_run == '' &&
      (needs.publish.result == 'success' ||
        (needs.prepare.outputs.candidate != 'true' &&
          (needs.prepare.outputs.needs_release == 'true' || inputs.package_current || github.event_name == 'push')))
    uses: ./.github/workflows/package-macc.yaml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
    secrets:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

  release:
    needs: [prepare, package]
    if: >-
      !cancelled() && !inputs.dry_run && needs.prepare.result == 'success' &&
      needs.prepare.outputs.needs_release == 'true' &&
      (needs.package.result == 'success' || needs.prepare.outputs.previous_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/publish-macc-release.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: FlClash-MACC-*
          path: ${{ runner.temp }}/macc-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.previous_run || github.run_id }}

      - name: Publish verified installation packages to the fork
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          REVISION: ${{ needs.prepare.outputs.previous_revision || needs.prepare.outputs.revision }}
          SOURCE_RUN: ${{ needs.prepare.outputs.previous_run || github.run_id }}
        run: |
          bash .github/scripts/publish-macc-release.sh "$RUNNER_TEMP/macc-artifacts" "$RUNNER_TEMP/macc-release"
